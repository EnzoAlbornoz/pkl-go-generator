name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24", stable]
    env:
      PKL_VERSION: 0.32.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Install Pkl
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/pkl" \
            "https://github.com/apple/pkl/releases/download/$PKL_VERSION/pkl-linux-amd64"
          chmod +x "$RUNNER_TEMP/bin/pkl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
