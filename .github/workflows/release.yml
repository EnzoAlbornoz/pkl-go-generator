name: release

# Pushing a tag such as v1.2.3 tests the tagged commit, builds the archives,
# signs them with packslip, and publishes them in a GitHub release. Tags
# with a suffix, such as v1.2.3-rc.1, publish a prerelease.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    # GitHub resolves this reusable workflow at the tagged commit, not from a
    # workspace, and actionlint does not know the newer $/ form yet.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  build:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # Build releases from a clean state.
      - name: Build the archive
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: ./scripts/dist.sh "$GITHUB_REF_NAME" "$TARGET_OS" "$TARGET_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # Signing runs apart from the release job, without write access to the
  # repository, as https://packslip.dev/docs/publishing/ recommends.
  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read the repository metadata.
      id-token: write # Sign with the workflow's identity.
      attestations: write # Attest the archives.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: jdx/packslip@0e9bde4ea49070555a79cac1f040f1dafe60acd6 # v1.8.0
        id: packslip
        with:
          artifacts: dist/*.tar.gz dist/*.zip
          bin: pkl-go-generator
          upload: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  release:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          set -- --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          case $GITHUB_REF_NAME in *-*) set -- "$@" --prerelease ;; esac
          # Publish only once every file is attached, which immutable
          # releases require.
          gh release create "$GITHUB_REF_NAME" --draft "$@" \
            *.tar.gz *.zip SHA256SUMS packslip.sigstore.json
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
